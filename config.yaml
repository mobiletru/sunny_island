name: Sunny Island
version: "2.2.16"
slug: sunny_island
description: >-
  One plant app: Tesla EVTV BMS + Ingress UI (parameter buttons, wrench quirks,
  Tessie auto amps, WebBox grid) + Enphase.
url: https://github.com/mobiletru/sunny_island
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: application
hassio_api: true
homeassistant_api: true
host_network: false
ingress: true
ingress_port: 8098
panel_icon: mdi:solar-power-variant
panel_title: Sunny Island
# Home Assistant config at /config (same path the installer already uses).
# Do not also map app_config — that defaults to /config and would conflict.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
watchdog: "http://[HOST]:[PORT:8098]/health"
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Plant UI (optional; prefer Ingress sidebar)
options:
  auto_sync: true
  install_dashboard: true
  force_overwrite: false
  retire_legacy_apps: true
  pack_prefix: battery_storage_tesla_pack
  envoy_prefix: sensor.envoy_122039004946
  ha_token: ""
  log_level: info
  auto_setup_bms: true
  bms_udp_port: 6550
  webbox_host: ""
  webbox_password: ""
schema:
  auto_sync: bool
  install_dashboard: bool
  force_overwrite: bool
  retire_legacy_apps: bool
  pack_prefix: str
  envoy_prefix: str
  ha_token: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  auto_setup_bms: bool
  bms_udp_port: int
  webbox_host: str?
  webbox_password: password?
