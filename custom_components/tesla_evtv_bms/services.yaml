set_grid_control:
  name: Set WebBox grid control
  description: >
    Write Sunny Island grid-start parameter via WebBox JSON-RPC SetParameter
    (channel GdManStr: Start | Auto | Stop). Falls back to Modbus register
    40527 when RPC is unavailable. Modes: off, manual_on (request grid),
    automatic. Requires WebBox password (plain text, e.g. sma) in the
    integration Configure dialog — MD5 is applied automatically for RPC.
  fields:
    mode:
      name: Mode
      description: "off | manual_on | automatic (aliases start, on, auto, Stop, Start, Auto)"
      required: true
      example: "manual_on"
      selector:
        select:
          options:
            - "off"
            - "manual_on"
            - "automatic"
    entity_prefix:
      name: Entity prefix
      description: Optional pack prefix (default battery_storage_tesla_pack)
      required: false
      example: battery_storage_tesla_pack
      selector:
        text:
    name:
      name: Pack name
      description: Optional config entry name filter (lowercased)
      required: false
      selector:
        text:

set_si_parameter:
  name: Set Sunny Island parameter
  description: >
    Write a Sunny Island parameter. Used by the plant app parameter buttons.
    bat_typ and grid_control use WebBox JSON-RPC SetParameter (channels BatTyp
    and GdManStr). Other ids write Modbus unit 3. Parameters: bat_typ,
    grid_control, reverse_feed, power_setpoint_mode, discharge_limit,
    feed_soc_upper, feed_soc_lower, power_setpoint_timeout.
  fields:
    parameter:
      name: Parameter
      description: SI parameter id (bat_typ / BatTyp = menu 221.01 battery type)
      required: true
      example: bat_typ
      selector:
        select:
          options:
            - bat_typ
            - grid_control
            - reverse_feed
            - power_setpoint_mode
            - discharge_limit
            - feed_soc_upper
            - feed_soc_lower
            - power_setpoint_timeout
    value:
      name: Value
      description: >
        BatTyp: LiIon_Ext-BMS (Tesla EVTV) | VRLA | FLA | NiCd | Other.
        Other enums: yes/no, off/manual_w/manual_pct/external, manual_on/automatic.
        Or integer (limits 0–100, timeout seconds).
      required: true
      example: "LiIon_Ext-BMS"
      selector:
        text:
    entity_prefix:
      name: Entity prefix
      required: false
      example: battery_storage_tesla_pack
      selector:
        text:
    name:
      name: Pack name
      required: false
      selector:
        text:
