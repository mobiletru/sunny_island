set_grid_control:
  name: Set WebBox grid control
  description: >
    Write Sunny Island grid-start parameter via WebBox JSON-RPC SetParameter
    (channel GdManStr: Start | Auto | Stop). Falls back to Modbus register
    40527 when RPC is unavailable. Modes: off, manual_on (request grid),
    automatic. Requires WebBox password (plain text, e.g. sma) in the
    integration Configure dialog — MD5 is applied automatically for RPC.
  fields:
    mode:
      name: Mode
      description: "off | manual_on | automatic (aliases start, on, auto, Stop, Start, Auto)"
      required: true
      example: "manual_on"
      selector:
        select:
          options:
            - "off"
            - "manual_on"
            - "automatic"
    entity_prefix:
      name: Entity prefix
      description: Optional pack prefix (default battery_storage_tesla_pack)
      required: false
      example: battery_storage_tesla_pack
      selector:
        text:
    name:
      name: Pack name
      description: Optional config entry name filter (lowercased)
      required: false
      selector:
        text:

set_si_parameter:
  name: Set Sunny Island parameter
  description: >
    Write a Sunny Island parameter. Used by the plant app parameter buttons.
    RPC SetParameter: bat_typ (BatTyp), grid_control (GdManStr), and VRLA
    charge voltages (ChrgVtgBoost / Ful / Equ / Flo, BatVtgNom / Max / Min,
    BatMinDchrgVtg, BatChrgVtgSimMan / BatChrgVtgMan). BatChrgVtg is
    read-only. Other ids write Modbus unit 3.
  fields:
    parameter:
      name: Parameter
      description: SI parameter id (firmware name or snake_case id)
      required: true
      example: chrg_vtg_boost
      selector:
        select:
          options:
            - bat_typ
            - chrg_vtg_boost
            - chrg_vtg_ful
            - chrg_vtg_equ
            - chrg_vtg_flo
            - bat_vtg_nom
            - bat_vtg_max
            - bat_vtg_min
            - bat_min_dchrg_vtg
            - bat_chrg_vtg_sim_man
            - bat_chrg_vtg_man
            - grid_control
            - reverse_feed
            - power_setpoint_mode
            - discharge_limit
            - feed_soc_upper
            - feed_soc_lower
            - power_setpoint_timeout
    value:
      name: Value
      description: >
        BatTyp: LiIon_Ext-BMS | VRLA | FLA | NiCd | Other.
        Charge voltages: V/cell for ChrgVtg* (official 1.4–2.7), pack V for
        BatChrgVtgMan (41–63). Other enums or integers as before.
      required: true
      example: "2.40"
      selector:
        text:
    entity_prefix:
      name: Entity prefix
      required: false
      example: battery_storage_tesla_pack
      selector:
        text:
    name:
      name: Pack name
      required: false
      selector:
        text:
