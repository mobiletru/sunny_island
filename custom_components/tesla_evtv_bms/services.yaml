set_webbox:
  name: Set WebBox host
  description: >
    Write SMA WebBox host and/or password onto the Tesla EVTV BMS config
    entry. Empty fields are left unchanged (will not clear a host set in
    Configure). Reloads the integration only when a value actually changes.
  fields:
    host:
      name: Host
      description: WebBox IP or hostname (http(s) and path are stripped)
      required: false
      example: "192.168.1.180"
      selector:
        text:
    password:
      name: Password
      description: WebBox RPC password (plain text; hashed by the integration)
      required: false
      example: sma
      selector:
        text:
          type: password
    entry_id:
      name: Config entry ID
      description: Optional; defaults to every Tesla EVTV BMS entry
      required: false
      selector:
        text:

set_grid_control:
  name: Set WebBox grid control
  description: >
    Write Sunny Island grid-start parameter via WebBox JSON-RPC SetParameter
    (channel GdManStr: Start | Auto | Stop). Falls back to Modbus register
    40527 when RPC is unavailable. Modes: off, manual_on (request grid),
    automatic. Requires WebBox password (plain text, e.g. sma) in the
    integration Configure dialog — MD5 is applied automatically for RPC.
  fields:
    mode:
      name: Mode
      description: "off | manual_on | automatic (aliases start, on, auto, Stop, Start, Auto)"
      required: true
      example: "manual_on"
      selector:
        select:
          options:
            - "off"
            - "manual_on"
            - "automatic"
    entity_prefix:
      name: Entity prefix
      description: Optional pack prefix (default battery_storage_tesla_pack)
      required: false
      example: battery_storage_tesla_pack
      selector:
        text:
    name:
      name: Pack name
      description: Optional config entry name filter (lowercased)
      required: false
      selector:
        text:

set_si_parameter:
  name: Set Sunny Island parameter
  description: >
    Write a Sunny Island / WebBox parameter. Used by the plant app parameter
    buttons. Charge voltages use WebBox RPC SetParameter (SI6048UM). Other
    parameters use Modbus unit 3. grid_control tries RPC GdManStr first.
  fields:
    parameter:
      name: Parameter
      description: SI parameter id
      required: true
      example: reverse_feed
      selector:
        select:
          options:
            - grid_control
            - reverse_feed
            - power_setpoint_mode
            - discharge_limit
            - feed_soc_upper
            - feed_soc_lower
            - power_setpoint_timeout
            - charge_voltage_full
            - charge_voltage_float
            - charge_voltage_boost
            - charge_voltage_equalize
            - charge_voltage_manual
            - charge_current_max
            - inverter_charge_current_max
            - charge_control
            - auto_equalize
            - absorption_time_boost
            - absorption_time_equalize
            - absorption_time_full
            - battery_nominal_v
            - battery_capacity_ah
            - self_consumption_min
            - silent_enable
            - sleep_enable
            - grid_current_nom
            - grid_voltage_min
            - grid_voltage_max
            - feed_in_soc_start
            - feed_in_soc_stop
    value:
      name: Value
      description: >
        Enum option (yes/no, off/manual_w/manual_pct/external, manual_on/automatic),
        integer (limits 0–100, timeout seconds), or charge voltage (V/cell for
        full/float/boost/equalize, pack V for manual)
      required: true
      example: "yes"
      selector:
        text:
    entity_prefix:
      name: Entity prefix
      required: false
      example: battery_storage_tesla_pack
      selector:
        text:
    name:
      name: Pack name
      required: false
      selector:
        text:
