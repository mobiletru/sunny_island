# Pack detail — classic masonry cards (compatible with YAML dashboards)
# Entities: sensor.battery_storage_tesla_pack_* · Enphase · Tessie

title: Pack detail
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:
      - type: markdown
        content: |
          # Pack detail
          Tesla **2-line 12S** · EVTV BMS · Enphase · Tessie
          Sign: **− discharge · + charge**

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V
            min: 36
            max: 50
            needle: true
            severity:
              red: 36
              yellow: 38.5
              green: 40
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_current
            name: Pack A (− out)
            min: -200
            max: 200
            needle: true

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_power
            name: Pack W
            min: -15000
            max: 15000
            needle: true
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox W
            min: -15000
            max: 15000
            needle: true
          - type: gauge
            entity: sensor.envoy_122039004946_current_power_production
            name: Enphase kW
            min: 0
            max: 15
            needle: true

      - type: entities
        title: Pack status
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_battery_status
            name: Status
          - entity: sensor.battery_storage_tesla_pack_summary
            name: Summary
          - entity: sensor.battery_storage_tesla_pack_fault_status
            name: Fault
          - entity: sensor.battery_storage_tesla_pack_fault_code
            name: Fault code
          - entity: sensor.battery_storage_tesla_pack_available_energy
            name: Available energy
          - entity: sensor.battery_storage_tesla_pack_charge
            name: Charge power
          - entity: sensor.battery_storage_tesla_pack_discharge
            name: Discharge power
          - entity: sensor.battery_storage_tesla_pack_tcch_amps
            name: BMS TCCH amps

      - type: entities
        title: SMA WebBox (HTTP + Modbus)
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: HTTP live power
          - entity: sensor.webbox_plant_power
            name: Modbus plant power
          - entity: sensor.webbox_plant_daily_yield
            name: Modbus daily yield
          - entity: sensor.webbox_plant_total_yield
            name: Modbus total yield
          - entity: sensor.webbox_device_status
            name: Device status
          - entity: sensor.webbox_grid_voltage
            name: Grid V
          - entity: sensor.webbox_grid_frequency
            name: Grid Hz
          - entity: sensor.webbox_battery_voltage
            name: SI battery V
          - entity: sensor.webbox_battery_temp
            name: SI battery temp

      - type: history-graph
        title: Pack + WebBox power (12 h)
        hours_to_show: 12
        entities:
          - entity: sensor.battery_storage_tesla_pack_power
            name: Pack
          - entity: sensor.webbox_plant_power
            name: WebBox Modbus
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox HTTP

  - title: Cells
    path: cells
    icon: mdi:battery-high
    cards:
      - type: entities
        title: Cell voltages
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_lowest_cell
            name: Lowest
          - entity: sensor.battery_storage_tesla_pack_highest_cell
            name: Highest
          - entity: sensor.battery_storage_tesla_pack_average_cell
            name: Average
          - entity: sensor.battery_storage_tesla_pack_cell_difference
            name: Δ
          - entity: sensor.battery_storage_tesla_pack_trigger_cell_voltage
            name: Trigger cell
          - entity: sensor.battery_storage_tesla_pack_lowest_temp
            name: Low temp
          - entity: sensor.battery_storage_tesla_pack_highest_temp
            name: High temp
          - entity: sensor.battery_storage_tesla_pack_total_modules
            name: Modules
          - entity: sensor.battery_storage_tesla_pack_total_cells
            name: Cells

      - type: history-graph
        title: Cell min/max (6 h)
        hours_to_show: 6
        entities:
          - entity: sensor.battery_storage_tesla_pack_lowest_cell
            name: Low
          - entity: sensor.battery_storage_tesla_pack_highest_cell
            name: High

  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    cards:
      - type: entities
        title: Pack kWh meters
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_charge_energy
            name: Charge total
          - entity: sensor.battery_storage_tesla_pack_discharge_energy
            name: Discharge total
          - entity: sensor.battery_storage_tesla_pack_charge_energy_day
            name: Charge today
          - entity: sensor.battery_storage_tesla_pack_discharge_energy_day
            name: Discharge today
          - entity: sensor.battery_storage_tesla_pack_charge_energy_week
            name: Charge week
          - entity: sensor.battery_storage_tesla_pack_discharge_energy_week
            name: Discharge week
          - entity: sensor.battery_storage_tesla_pack_hours_to_empty
            name: Hours to empty
          - entity: sensor.battery_storage_tesla_pack_hours_to_full
            name: Hours to full

      - type: entities
        title: Safety
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_contactor_positive
            name: Contactor +
          - entity: sensor.battery_storage_tesla_pack_contactor_negative
            name: Contactor −
          - entity: sensor.battery_storage_tesla_pack_charge_enable
            name: Charge enable
          - entity: sensor.battery_storage_tesla_pack_heat_enable
            name: Heat enable
          - entity: sensor.battery_storage_tesla_pack_high_voltage_cutoff
            name: HV cutoff
          - entity: sensor.battery_storage_tesla_pack_low_voltage_cutoff
            name: LV cutoff

  - title: Solar & car
    path: solar-car
    icon: mdi:solar-power
    cards:
      - type: entities
        title: Enphase
        show_header_toggle: false
        entities:
          - entity: sensor.envoy_122039004946_current_power_production
            name: Production
          - entity: sensor.envoy_122039004946_current_power_consumption
            name: Consumption
          - entity: sensor.envoy_122039004946_current_net_power_consumption
            name: Net
          - entity: sensor.envoy_122039004946_energy_production_today
            name: Produced today

      - type: entities
        title: WebBox Modbus sensors
        show_header_toggle: false
        entities:
          - entity: sensor.webbox_plant_power
            name: Plant power
          - entity: sensor.webbox_plant_daily_yield
            name: Daily yield
          - entity: sensor.webbox_plant_total_yield
            name: Total yield
          - entity: sensor.webbox_device_power_ac
            name: Device AC power
          - entity: sensor.webbox_device_status
            name: Status
          - entity: sensor.webbox_grid_voltage
            name: Grid V
          - entity: sensor.webbox_grid_frequency
            name: Grid Hz
          - entity: sensor.webbox_grid_relay
            name: Grid relay
          - entity: sensor.webbox_reactive_power
            name: Reactive
          - entity: sensor.webbox_apparent_power
            name: Apparent
          - entity: sensor.webbox_battery_voltage
            name: Battery V
          - entity: sensor.webbox_battery_soc
            name: Battery SoC
          - entity: sensor.webbox_battery_temp
            name: Battery temp
          - entity: sensor.webbox_operating_time
            name: Operating time
          - entity: sensor.webbox_serial_number
            name: WebBox serial
          - entity: sensor.webbox_device_serial
            name: Device serial

      - type: entities
        title: WebBox HTTP (BMS poller)
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: Live power
          - entity: sensor.battery_storage_tesla_pack_webbox_daily_yield
            name: Daily yield
          - entity: sensor.battery_storage_tesla_pack_webbox_total_yield
            name: Lifetime yield

      - type: history-graph
        title: WebBox solar (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.webbox_plant_power
            name: Modbus plant
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: HTTP

      - type: entities
        title: Stop Tessie at EVTV BMS voltage
        show_header_toggle: false
        entities:
          - entity: input_boolean.tessie_stop_on_pack_volts
            name: Use pack bus V
          - entity: input_number.tessie_stop_pack_volts
            name: Stop below pack V
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V now
          - entity: input_boolean.tessie_stop_on_cell_volts
            name: Use lowest cell V
          - entity: input_number.tessie_stop_cell_volts
            name: Stop below cell V
          - entity: sensor.battery_storage_tesla_pack_lowest_cell
            name: Lowest cell now
          - entity: input_number.tessie_stop_soc
            name: Stop below SoC %
          - entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: Pack SoC now

      - type: entities
        title: Tessie / car charger
        show_header_toggle: false
        entities:
          - entity: input_boolean.auto_tessie_amps
            name: Auto amps from BMS
          - entity: input_number.tessie_amps_cap
            name: Amps cap
          - entity: sensor.battery_storage_tesla_pack_tcch_amps
            name: BMS TCCH amps
          - entity: number.x_charge_current
            name: Tessie charge current
          - entity: sensor.x_charger_current
            name: Actual charger A
          - entity: sensor.x_battery_level
            name: Car battery
          - entity: sensor.x_charging
            name: Charge status
          - entity: sensor.x_charge_energy_added
            name: Session kWh
          - entity: sensor.x_energy_remaining
            name: Remaining kWh
          - entity: sensor.x_charger_power
            name: Charger power
          - entity: switch.x_charge
            name: Charge switch
          - entity: input_boolean.car_charger
            name: Charger flag
          - type: button
            name: Start charging
            entity: script.start_car_charger
            icon: mdi:ev-station
            tap_action:
              action: call-service
              service: script.start_car_charger
          - type: button
            name: Stop charging
            entity: script.shutdown_car_charger
            icon: mdi:ev-station-off
            tap_action:
              action: call-service
              service: script.shutdown_car_charger
