# Sunny Island — single plant dashboard (pack · WebBox · Enphase · Tessie)
# Entities: sensor.battery_storage_tesla_pack_* · Enphase · Tessie

title: Sunny Island
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:
      - type: markdown
        content: |
          # Sunny Island
          Tesla **2-line 12S** · EVTV BMS · SMA WebBox · Enphase · Tessie
          Sign: **− discharge · + charge**

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V
            min: 36
            max: 50
            needle: true
            severity:
              red: 36
              yellow: 38.5
              green: 40
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_current
            name: Pack A (− out)
            min: -200
            max: 200
            needle: true

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_power
            name: Pack W
            min: -15000
            max: 15000
            needle: true
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox W
            min: -15000
            max: 15000
            needle: true
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_tcch_amps
            name: TCCH A
            min: 0
            max: 200
            needle: true
            severity:
              red: 0
              yellow: 10
              green: 32

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.envoy_122039004946_current_power_production
            name: Solar kW
            min: 0
            max: 15
            needle: true
            severity:
              red: 0
              yellow: 1
              green: 5
          - type: gauge
            entity: sensor.envoy_122039004946_current_power_consumption
            name: Load kW
            min: 0
            max: 15
            needle: true
          - type: gauge
            entity: sensor.envoy_122039004946_current_net_power_consumption
            name: Net kW (+in)
            min: -15
            max: 15
            needle: true

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_lowest_cell
            name: Cell low V
            min: 2.8
            max: 4.2
            needle: true
            severity:
              red: 2.8
              yellow: 3.1
              green: 3.3
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_highest_cell
            name: Cell high V
            min: 2.8
            max: 4.2
            needle: true
            severity:
              red: 4.15
              yellow: 4.05
              green: 2.8
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_cell_difference
            name: Cell Δ V
            min: 0
            max: 0.15
            needle: true
            severity:
              green: 0
              yellow: 0.03
              red: 0.06

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_highest_temp
            name: Pack high °C
            min: 0
            max: 60
            needle: true
            severity:
              green: 0
              yellow: 35
              red: 45
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_lowest_temp
            name: Pack low °C
            min: -10
            max: 50
            needle: true
            severity:
              red: -10
              yellow: 5
              green: 15
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_available_energy
            name: Available kWh
            min: 0
            max: 50
            needle: true
            severity:
              red: 0
              yellow: 10
              green: 20

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_webbox_grid_voltage
            name: Grid V
            min: 100
            max: 140
            needle: true
            severity:
              red: 100
              yellow: 110
              green: 115
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_webbox_grid_frequency
            name: Grid Hz
            min: 55
            max: 65
            needle: true
            severity:
              red: 55
              yellow: 58
              green: 59.5
          - type: gauge
            entity: sensor.x_battery_level
            name: Car SoC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 50

      - type: entities
        title: Pack status
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_battery_status
            name: Status
          - entity: sensor.battery_storage_tesla_pack_summary
            name: Summary
          - entity: sensor.battery_storage_tesla_pack_fault_status
            name: Fault
          - entity: sensor.battery_storage_tesla_pack_fault_code
            name: Fault code
          - entity: sensor.battery_storage_tesla_pack_available_energy
            name: Available energy
          - entity: sensor.battery_storage_tesla_pack_charge
            name: Charge power
          - entity: sensor.battery_storage_tesla_pack_discharge
            name: Discharge power
          - entity: sensor.battery_storage_tesla_pack_tcch_amps
            name: BMS TCCH amps

      - type: entities
        title: WebBox plant
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: Plant power
          - entity: sensor.battery_storage_tesla_pack_webbox_power_kw
            name: Plant power kW
          - entity: sensor.battery_storage_tesla_pack_webbox_daily_yield
            name: Daily yield
          - entity: sensor.battery_storage_tesla_pack_webbox_total_yield
            name: Total yield
          - entity: sensor.battery_storage_tesla_pack_webbox_status
            name: Device status
          - entity: sensor.battery_storage_tesla_pack_webbox_grid_relay
            name: Grid relay
          - entity: sensor.battery_storage_tesla_pack_webbox_grid_voltage
            name: Grid V
          - entity: sensor.battery_storage_tesla_pack_webbox_grid_frequency
            name: Grid Hz

      - type: markdown
        content: >
          **Pack** ·
          {{ states('sensor.battery_storage_tesla_pack_volts') }} V ·
          {{ states('sensor.battery_storage_tesla_pack_current') }} A ·
          {{ states('sensor.battery_storage_tesla_pack_power') }} W
          · TCCH {{ states('sensor.battery_storage_tesla_pack_tcch_amps') }} A
          · {{ states('sensor.battery_storage_tesla_pack_total_modules') }} modules /
          {{ states('sensor.battery_storage_tesla_pack_active_cells') }} cells

          **WebBox RPC** ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_rpc_status') }} ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_device_key') }} ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_power') }} W now ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_daily_yield') }} kWh today ·
          SoC {{ states('sensor.battery_storage_tesla_pack_webbox_battery_soc') }}% ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_operating_status') }}

          **Enphase** ·
          prod {{ states('sensor.envoy_122039004946_current_power_production') }} kW ·
          load {{ states('sensor.envoy_122039004946_current_power_consumption') }} kW ·
          net {{ states('sensor.envoy_122039004946_current_net_power_consumption') }} kW

          **Tessie** ·
          set {{ states('number.x_charge_current') }} A ·
          actual {{ states('sensor.x_charger_current') }} A ·
          {{ states('sensor.x_charging') }} ·
          auto {{ states('input_boolean.auto_tessie_amps') }}

      - type: history-graph
        title: Pack + WebBox power (12 h)
        hours_to_show: 12
        entities:
          - entity: sensor.battery_storage_tesla_pack_power
            name: Pack
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox

      - type: history-graph
        title: SoC (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC

