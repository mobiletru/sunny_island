  - title: RPC
    path: rpc
    icon: mdi:api
    cards:
      - type: markdown
        content: |
          # Sunny Island · WebBox RPC
          Host **192.168.100.180** · password **sma** (MD5 in passwd field)
          Form field `RPC=<json>` · `GetPlantOverview` + `GetProcessData` (SI6048)
          Status must be **ok** — otherwise falling back to home.ajax only

          **RPC** · {{ states('sensor.battery_storage_tesla_pack_webbox_rpc_status') }}
          · device {{ states('sensor.battery_storage_tesla_pack_webbox_device_key') }}
          · {{ states('sensor.battery_storage_tesla_pack_webbox_power') }} W
