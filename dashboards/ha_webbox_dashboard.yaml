# WebBox plant — classic masonry cards (compatible with YAML dashboards)

title: WebBox plant
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:
      - type: markdown
        content: |
          # WebBox plant
          SMA Sunny WebBox · Tesla pack · Enphase
          Sign: **− discharge · + charge**

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: Battery SoC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_power
            name: Pack power
            min: -100000
            max: 100000
            needle: true
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox solar
            min: -15000
            max: 15000
            needle: true

      - type: entities
        title: SMA WebBox
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: Live power
          - entity: sensor.battery_storage_tesla_pack_webbox_daily_yield
            name: Daily yield
          - entity: sensor.battery_storage_tesla_pack_webbox_total_yield
            name: Lifetime yield

      - type: entities
        title: Plant at a glance
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_battery_status
            name: Pack status
          - entity: sensor.battery_storage_tesla_pack_fault_status
            name: Faults
          - entity: sensor.battery_storage_tesla_pack_summary
            name: Summary
          - entity: sensor.battery_storage_tesla_pack_available_energy
            name: Available energy
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V
          - entity: sensor.battery_storage_tesla_pack_current
            name: Pack A
          - entity: sensor.battery_storage_tesla_pack_tcch_amps
            name: BMS TCCH amps

      - type: entities
        title: Stop Tessie at EVTV BMS voltage
        show_header_toggle: false
        entities:
          - entity: input_boolean.tessie_stop_on_pack_volts
            name: Use pack bus V
          - entity: input_number.tessie_stop_pack_volts
            name: Stop below pack V
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V now
          - entity: input_boolean.tessie_stop_on_cell_volts
            name: Use lowest cell V
          - entity: input_number.tessie_stop_cell_volts
            name: Stop below cell V
          - entity: input_number.tessie_stop_soc
            name: Stop below SoC %

      - type: entities
        title: Tessie auto amps
        show_header_toggle: false
        entities:
          - entity: input_boolean.auto_tessie_amps
            name: Auto amps from BMS
          - entity: input_number.tessie_amps_cap
            name: Amps cap
          - entity: number.x_charge_current
            name: Tessie charge current
          - entity: sensor.x_charger_current
            name: Actual charger A
          - entity: switch.x_charge
            name: Charge switch
          - entity: sensor.x_charging
            name: Charge status

      - type: markdown
        content: >
          **Pack** ·
          {{ states('sensor.battery_storage_tesla_pack_volts') }} V ·
          {{ states('sensor.battery_storage_tesla_pack_current') }} A ·
          {{ states('sensor.battery_storage_tesla_pack_power') }} W
          · TCCH {{ states('sensor.battery_storage_tesla_pack_tcch_amps') }} A
          · {{ states('sensor.battery_storage_tesla_pack_total_modules') }} modules /
          {{ states('sensor.battery_storage_tesla_pack_active_cells') }} cells

          **Solar (WebBox)** ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_power') }} W now ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_daily_yield') }} kWh today ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_total_yield') }} kWh lifetime

          **Enphase** ·
          prod {{ states('sensor.envoy_122039004946_current_power_production') }} kW ·
          load {{ states('sensor.envoy_122039004946_current_power_consumption') }} kW ·
          net {{ states('sensor.envoy_122039004946_current_net_power_consumption') }} kW

          **Tessie** ·
          set {{ states('number.x_charge_current') }} A ·
          actual {{ states('sensor.x_charger_current') }} A ·
          {{ states('sensor.x_charging') }} ·
          auto {{ states('input_boolean.auto_tessie_amps') }}

      - type: history-graph
        title: Pack + WebBox power (12 h)
        hours_to_show: 12
        entities:
          - entity: sensor.battery_storage_tesla_pack_power
            name: Pack
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox solar

      - type: history-graph
        title: SoC (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC


  - title: Solar
    path: solar
    icon: mdi:solar-power
    cards:
      - type: entities
        title: SMA Sunny WebBox
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: Live power
          - entity: sensor.battery_storage_tesla_pack_webbox_daily_yield
            name: Today
          - entity: sensor.battery_storage_tesla_pack_webbox_total_yield
            name: Lifetime

      - type: history-graph
        title: WebBox solar power
        hours_to_show: 24
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox

      - type: entities
        title: Enphase (site)
        show_header_toggle: false
        entities:
          - entity: sensor.envoy_122039004946_current_power_production
            name: Production
          - entity: sensor.envoy_122039004946_current_power_consumption
            name: Consumption
          - entity: sensor.envoy_122039004946_current_net_power_consumption
            name: Net (import + / export −)
          - entity: sensor.envoy_122039004946_energy_production_today
            name: Produced today
          - entity: sensor.envoy_122039004946_energy_consumption_today
            name: Consumed today
          - entity: sensor.envoy_122039004946_lifetime_energy_production
            name: Lifetime production

  - title: Battery
    path: battery
    icon: mdi:car-battery
    cards:
      - type: entities
        title: Tesla pack (EVTV BMS)
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Voltage
          - entity: sensor.battery_storage_tesla_pack_current
            name: Current
          - entity: sensor.battery_storage_tesla_pack_power
            name: Power
          - entity: sensor.battery_storage_tesla_pack_battery_status
            name: Status
          - entity: sensor.battery_storage_tesla_pack_lowest_cell
            name: Lowest cell
          - entity: sensor.battery_storage_tesla_pack_highest_cell
            name: Highest cell
          - entity: sensor.battery_storage_tesla_pack_average_cell
            name: Average cell
          - entity: sensor.battery_storage_tesla_pack_cell_difference
            name: Cell Δ
          - entity: sensor.battery_storage_tesla_pack_charge_energy_day
            name: Charge today
          - entity: sensor.battery_storage_tesla_pack_discharge_energy_day
            name: Discharge today
