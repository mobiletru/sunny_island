# WebBox plant — classic masonry cards (compatible with YAML dashboards)

title: WebBox plant
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:
      - type: markdown
        content: |
          # WebBox plant
          SMA Sunny WebBox · Tesla pack · Enphase
          Sign: **− discharge · + charge**

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: Battery SoC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 25
              green: 50
          - type: gauge
            entity: sensor.battery_storage_tesla_pack_power
            name: Pack power
            min: -100000
            max: 100000
            needle: true
          - type: gauge
            entity: sensor.webbox_plant_power
            name: WebBox plant W
            min: -15000
            max: 15000
            needle: true

      - type: entities
        title: WebBox HTTP (BMS poller)
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: Live power
          - entity: sensor.battery_storage_tesla_pack_webbox_daily_yield
            name: Daily yield
          - entity: sensor.battery_storage_tesla_pack_webbox_total_yield
            name: Lifetime yield

      - type: entities
        title: WebBox Modbus — plant
        show_header_toggle: false
        entities:
          - entity: sensor.webbox_plant_power
            name: Plant power
          - entity: sensor.webbox_plant_power_kw
            name: Plant power kW
          - entity: sensor.webbox_plant_daily_yield
            name: Daily yield
          - entity: sensor.webbox_plant_total_yield
            name: Total yield
          - entity: sensor.webbox_device_status
            name: Device status
          - entity: sensor.webbox_grid_relay
            name: Grid relay

      - type: entities
        title: Plant at a glance
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_battery_status
            name: Pack status
          - entity: sensor.battery_storage_tesla_pack_fault_status
            name: Faults
          - entity: sensor.battery_storage_tesla_pack_summary
            name: Summary
          - entity: sensor.battery_storage_tesla_pack_available_energy
            name: Available energy
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V
          - entity: sensor.battery_storage_tesla_pack_current
            name: Pack A
          - entity: sensor.battery_storage_tesla_pack_tcch_amps
            name: BMS TCCH amps

      - type: entities
        title: Stop Tessie at EVTV BMS voltage
        show_header_toggle: false
        entities:
          - entity: input_boolean.tessie_stop_on_pack_volts
            name: Use pack bus V
          - entity: input_number.tessie_stop_pack_volts
            name: Stop below pack V
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Pack V now
          - entity: input_boolean.tessie_stop_on_cell_volts
            name: Use lowest cell V
          - entity: input_number.tessie_stop_cell_volts
            name: Stop below cell V
          - entity: input_number.tessie_stop_soc
            name: Stop below SoC %

      - type: entities
        title: Tessie auto amps
        show_header_toggle: false
        entities:
          - entity: input_boolean.auto_tessie_amps
            name: Auto amps from BMS
          - entity: input_number.tessie_amps_cap
            name: Amps cap
          - entity: number.x_charge_current
            name: Tessie charge current
          - entity: sensor.x_charger_current
            name: Actual charger A
          - entity: switch.x_charge
            name: Charge switch
          - entity: sensor.x_charging
            name: Charge status

      - type: markdown
        content: >
          **Pack** ·
          {{ states('sensor.battery_storage_tesla_pack_volts') }} V ·
          {{ states('sensor.battery_storage_tesla_pack_current') }} A ·
          {{ states('sensor.battery_storage_tesla_pack_power') }} W
          · TCCH {{ states('sensor.battery_storage_tesla_pack_tcch_amps') }} A
          · {{ states('sensor.battery_storage_tesla_pack_total_modules') }} modules /
          {{ states('sensor.battery_storage_tesla_pack_active_cells') }} cells

          **Solar (WebBox)** ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_power') }} W now ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_daily_yield') }} kWh today ·
          {{ states('sensor.battery_storage_tesla_pack_webbox_total_yield') }} kWh lifetime

          **Enphase** ·
          prod {{ states('sensor.envoy_122039004946_current_power_production') }} kW ·
          load {{ states('sensor.envoy_122039004946_current_power_consumption') }} kW ·
          net {{ states('sensor.envoy_122039004946_current_net_power_consumption') }} kW

          **Tessie** ·
          set {{ states('number.x_charge_current') }} A ·
          actual {{ states('sensor.x_charger_current') }} A ·
          {{ states('sensor.x_charging') }} ·
          auto {{ states('input_boolean.auto_tessie_amps') }}

      - type: history-graph
        title: Pack + WebBox power (12 h)
        hours_to_show: 12
        entities:
          - entity: sensor.battery_storage_tesla_pack_power
            name: Pack
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: WebBox solar

      - type: history-graph
        title: SoC (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC


  - title: Solar
    path: solar
    icon: mdi:solar-power
    cards:
      - type: entities
        title: WebBox HTTP (BMS poller)
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: Live power
          - entity: sensor.battery_storage_tesla_pack_webbox_daily_yield
            name: Today
          - entity: sensor.battery_storage_tesla_pack_webbox_total_yield
            name: Lifetime

      - type: history-graph
        title: WebBox plant power (Modbus)
        hours_to_show: 24
        entities:
          - entity: sensor.webbox_plant_power
            name: Plant Modbus
          - entity: sensor.battery_storage_tesla_pack_webbox_power
            name: HTTP poller
          - entity: sensor.webbox_device_power_ac
            name: Device AC

      - type: entities
        title: Enphase (site)
        show_header_toggle: false
        entities:
          - entity: sensor.envoy_122039004946_current_power_production
            name: Production
          - entity: sensor.envoy_122039004946_current_power_consumption
            name: Consumption
          - entity: sensor.envoy_122039004946_current_net_power_consumption
            name: Net (import + / export −)
          - entity: sensor.envoy_122039004946_energy_production_today
            name: Produced today
          - entity: sensor.envoy_122039004946_energy_consumption_today
            name: Consumed today
          - entity: sensor.envoy_122039004946_lifetime_energy_production
            name: Lifetime production

  - title: Modbus
    path: modbus
    icon: mdi:lan-connect
    cards:
      - type: markdown
        content: |
          # WebBox Modbus TCP
          Host `secrets.webbox_host` · port **502**
          Unit **1** gateway · **2** plant · **3** device (SI)

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.webbox_plant_power
            name: Plant W
            min: -20000
            max: 20000
            needle: true
          - type: gauge
            entity: sensor.webbox_grid_voltage
            name: Grid V
            min: 100
            max: 140
            needle: true
          - type: gauge
            entity: sensor.webbox_grid_frequency
            name: Grid Hz
            min: 55
            max: 65
            needle: true

      - type: entities
        title: Plant (Unit ID 2)
        show_header_toggle: false
        entities:
          - entity: sensor.webbox_plant_power
            name: Active power
          - entity: sensor.webbox_plant_power_kw
            name: Active power kW
          - entity: sensor.webbox_plant_daily_yield
            name: Daily yield
          - entity: sensor.webbox_plant_total_yield
            name: Total yield

      - type: entities
        title: Device / SI parameters (Unit ID 3)
        show_header_toggle: false
        entities:
          - entity: sensor.webbox_device_status
            name: Status
          - entity: sensor.webbox_device_status_code
            name: Status code
          - entity: sensor.webbox_device_power_ac
            name: Power AC
          - entity: sensor.webbox_grid_voltage
            name: Grid voltage
          - entity: sensor.webbox_grid_frequency
            name: Grid frequency
          - entity: sensor.webbox_grid_relay
            name: Grid relay
          - entity: sensor.webbox_grid_relay_code
            name: Grid relay code
          - entity: sensor.webbox_reactive_power
            name: Reactive power
          - entity: sensor.webbox_apparent_power
            name: Apparent power
          - entity: sensor.webbox_battery_voltage
            name: Battery voltage
          - entity: sensor.webbox_battery_soc
            name: Battery SoC
          - entity: sensor.webbox_battery_temp
            name: Battery temp
          - entity: sensor.webbox_operating_time
            name: Operating time
          - entity: sensor.webbox_device_serial
            name: Device serial
          - entity: sensor.webbox_device_susy_id
            name: SuSy ID

      - type: entities
        title: Gateway (Unit ID 1)
        show_header_toggle: false
        entities:
          - entity: sensor.webbox_modbus_profile
            name: Modbus profile
          - entity: sensor.webbox_serial_number
            name: WebBox serial

      - type: history-graph
        title: Modbus power / grid (12 h)
        hours_to_show: 12
        entities:
          - entity: sensor.webbox_plant_power
            name: Plant W
          - entity: sensor.webbox_device_power_ac
            name: Device W
          - entity: sensor.webbox_grid_voltage
            name: Grid V

  - title: Battery
    path: battery
    icon: mdi:car-battery
    cards:
      - type: entities
        title: Tesla pack (EVTV BMS)
        show_header_toggle: false
        entities:
          - entity: sensor.battery_storage_tesla_pack_state_of_charge
            name: SoC
          - entity: sensor.battery_storage_tesla_pack_volts
            name: Voltage
          - entity: sensor.battery_storage_tesla_pack_current
            name: Current
          - entity: sensor.battery_storage_tesla_pack_power
            name: Power
          - entity: sensor.battery_storage_tesla_pack_battery_status
            name: Status
          - entity: sensor.battery_storage_tesla_pack_lowest_cell
            name: Lowest cell
          - entity: sensor.battery_storage_tesla_pack_highest_cell
            name: Highest cell
          - entity: sensor.battery_storage_tesla_pack_average_cell
            name: Average cell
          - entity: sensor.battery_storage_tesla_pack_cell_difference
            name: Cell Δ
          - entity: sensor.battery_storage_tesla_pack_charge_energy_day
            name: Charge today
          - entity: sensor.battery_storage_tesla_pack_discharge_energy_day
            name: Discharge today
