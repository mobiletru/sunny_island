shutdown_car_charger:
  alias: Shutdown car charger
  icon: mdi:ev-station
  description: >
    Stop Tesla charging via Tessie (switch.x_charge → stop_charging).
    Wakes the car if needed, sets charge current to 0, notifies Companion (Plaid).
  mode: single
  sequence:
    - if:
        - condition: template
          value_template: "{{ states('switch.x_charge') in ['unavailable', 'unknown', 'none', ''] }}"
      then:
        - action: persistent_notification.create
          data:
            title: Tessie missing
            message: switch.x_charge not found — re-add the Tessie integration.
            notification_id: tessie_missing
        - stop: Tessie entities missing
    - continue_on_error: true
      action: button.press
      target:
        entity_id: button.x_wake
    - delay:
        seconds: 3
    - action: switch.turn_off
      target:
        entity_id: switch.x_charge
    - continue_on_error: true
      action: number.set_value
      target:
        entity_id: number.x_charge_current
      data:
        value: 0
    - delay:
        seconds: 5
    - if:
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.x_charge
              state: "on"
            - condition: state
              entity_id: sensor.x_charging
              state: charging
      then:
        - continue_on_error: true
          action: button.press
          target:
            entity_id: button.x_wake
        - delay:
            seconds: 2
        - action: switch.turn_off
          target:
            entity_id: switch.x_charge
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: 0
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.car_charger
    - action: logbook.log
      data:
        name: Car charger (Tessie)
        message: >-
          Tessie stop_charging — charge={{ states('sensor.x_charging') }},
          switch={{ states('switch.x_charge') }},
          amps={{ states('number.x_charge_current') }},
          cell {{ states('sensor.battery_storage_tesla_pack_lowest_cell') }} V,
          SoC {{ states('sensor.battery_storage_tesla_pack_state_of_charge') }}%
        entity_id: switch.x_charge
    - action: script.notify_iphone
      data:
        title: "Car charging stopped (Tessie)"
        message: >-
          Pack cell {{ states('sensor.battery_storage_tesla_pack_lowest_cell') }} V ·
          SoC {{ states('sensor.battery_storage_tesla_pack_state_of_charge') }}% ·
          charge={{ states('sensor.x_charging') }}.

start_car_charger:
  alias: Start car charger
  icon: mdi:ev-station
  description: >
    Start Tesla charging via Tessie (switch.x_charge). Blocks on pack protection
    or unplugged cable. If car SoC is at/near charge limit (status complete),
    raises limit so Tesla will accept charge. Sets amps from EVTV BMS TCCH.
  mode: restart
  sequence:
    # --- Tessie must be loaded ---
    - if:
        - condition: template
          value_template: >-
            {{ states('switch.x_charge') in ['unavailable', 'unknown', 'none', '']
               or states('sensor.x_charging') in ['unavailable', 'unknown', 'none', ''] }}
      then:
        - action: script.notify_iphone
          data:
            title: "Start charging blocked"
            message: Tessie entities missing — re-add Tessie integration (API token).
        - action: persistent_notification.create
          data:
            title: Tessie missing
            message: >-
              switch.x_charge / sensor.x_charging not available.
              Settings → Devices → Add integration → Tessie.
            notification_id: tessie_missing
        - stop: Tessie entities missing

    - variables:
        pack_s: "{{ states('sensor.battery_storage_tesla_pack_volts') }}"
        cell_s: "{{ states('sensor.battery_storage_tesla_pack_lowest_cell') }}"
        soc_s: "{{ states('sensor.battery_storage_tesla_pack_state_of_charge') }}"
        batt_s: "{{ states('sensor.x_battery_level') }}"
        limit_s: "{{ states('number.x_charge_limit') }}"
        charge_s: "{{ states('sensor.x_charging') }}"
        blocked: >-
          {% set bad = ['unavailable', 'unknown', 'none', ''] %}
          {% set pack = pack_s | float(99) if pack_s not in bad else 99 %}
          {% set cell = cell_s | float(99) if cell_s not in bad else 99 %}
          {% set soc = soc_s | float(100) if soc_s not in bad else 100 %}
          {% set stop_pack = states('input_number.tessie_stop_pack_volts') | float(38.4) %}
          {% set stop_cell = states('input_number.tessie_stop_cell_volts') | float(3.2) %}
          {% set stop_soc = states('input_number.tessie_stop_soc') | float(15) %}
          {% set use_pack = is_state('input_boolean.tessie_stop_on_pack_volts', 'on') %}
          {% set use_cell = is_state('input_boolean.tessie_stop_on_cell_volts', 'on') %}
          {{ (use_pack and pack <= stop_pack)
             or (use_cell and cell <= stop_cell)
             or (soc <= stop_soc) }}
        # At/near limit OR status complete → Tesla will not start until limit rises
        need_raise_limit: >-
          {% set bad = ['unavailable', 'unknown', 'none', ''] %}
          {% set batt = batt_s | float(-1) if batt_s not in bad else -1 %}
          {% set lim = limit_s | float(100) if limit_s not in bad else 100 %}
          {% set ch = (charge_s | string | lower) %}
          {{ (batt >= 0 and batt >= (lim - 1.0)) or ch in ['complete', 'stopped'] }}
        new_limit: >-
          {% set bad = ['unavailable', 'unknown', 'none', ''] %}
          {% set batt = batt_s | float(0) if batt_s not in bad else 0 %}
          {% set lim = limit_s | float(80) if limit_s not in bad else 80 %}
          {# At least +5% above car SoC, and at least +5 above current limit #}
          {% set from_batt = (batt | round(0, 'ceil') | int) + 5 %}
          {% set from_lim = (lim | int) + 5 %}
          {% set want = [from_batt, from_lim, lim | int] | max %}
          {{ [want | int, 100] | min }}

    - if:
        - condition: template
          value_template: "{{ blocked | bool }}"
      then:
        - action: script.notify_iphone
          data:
            title: "Start charging blocked"
            message: >-
              Pack below stop threshold
              (pack {{ pack_s }} V / cell {{ cell_s }} V / SoC {{ soc_s }}%).
        - action: persistent_notification.create
          data:
            title: Start charging blocked
            message: >-
              Pack {{ pack_s }} V · cell {{ cell_s }} V · SoC {{ soc_s }}%
              — will not start Tessie charge.
            notification_id: car_charger_start_blocked
        - stop: Pack below protection threshold

    # Cable: only block when sensor exists AND is clearly off
    - if:
        - condition: template
          value_template: >-
            {{ states('binary_sensor.x_charge_cable') not in
               ['unavailable', 'unknown', 'none', '']
               and is_state('binary_sensor.x_charge_cable', 'off') }}
      then:
        - action: script.notify_iphone
          data:
            title: "Start charging blocked"
            message: Charge cable not connected.
        - action: persistent_notification.create
          data:
            title: Start charging blocked
            message: Plug in the charge cable, then try Start charging again.
            notification_id: car_charger_start_blocked
        - stop: Charge cable not connected

    # Wake car
    - continue_on_error: true
      action: button.press
      target:
        entity_id: button.x_wake
    - delay:
        seconds: 5
    - if:
        - condition: template
          value_template: >-
            {{ states('binary_sensor.x_status') not in
               ['unavailable', 'unknown', 'none', '']
               and is_state('binary_sensor.x_status', 'off') }}
      then:
        - continue_on_error: true
          action: button.press
          target:
            entity_id: button.x_wake
        - delay:
            seconds: 8

    # Raise charge limit so Tesla leaves "complete"
    - if:
        - condition: template
          value_template: "{{ need_raise_limit | bool }}"
      then:
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_limit
          data:
            value: "{{ new_limit | int }}"
        - action: logbook.log
          data:
            name: Car charger (Tessie)
            message: >-
              Charge limit raised {{ limit_s }}% → {{ new_limit }}%
              (car {{ batt_s }}%, status {{ charge_s }})
            entity_id: number.x_charge_limit
        - delay:
            seconds: 3

    # Set amps from BMS (TCCH); floor 8 A if script yields 0
    - action: script.set_tessie_amps_from_bms
      continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ states('number.x_charge_current') | float(0) < 1 }}"
      then:
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: 8
    - delay:
        seconds: 1

    # Start charge
    - continue_on_error: true
      action: switch.turn_on
      target:
        entity_id: switch.x_charge
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.car_charger

    # Re-apply amps after start
    - delay:
        seconds: 2
    - action: script.set_tessie_amps_from_bms
      continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ states('number.x_charge_current') | float(0) < 1 }}"
      then:
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: 8

    - delay:
        seconds: 6

    # Retry if still not started
    - if:
        - condition: template
          value_template: >-
            {{ not is_state('switch.x_charge', 'on')
               and states('sensor.x_charging') | lower not in ['charging', 'starting'] }}
      then:
        # Raise limit again if still complete
        - if:
            - condition: template
              value_template: >-
                {{ is_state('sensor.x_charging', 'complete')
                   or (states('sensor.x_battery_level') | float(0)
                       >= states('number.x_charge_limit') | float(100) - 1) }}
          then:
            - continue_on_error: true
              action: number.set_value
              target:
                entity_id: number.x_charge_limit
              data:
                value: >-
                  {% set b = states('sensor.x_battery_level') | float(0) | round(0, 'ceil') | int %}
                  {{ [b + 5, (states('number.x_charge_limit') | int) + 5, 100] | min }}
            - delay:
                seconds: 2
        - continue_on_error: true
          action: button.press
          target:
            entity_id: button.x_wake
        - delay:
            seconds: 4
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: >-
              {% set a = states('number.x_charge_current') | float(0) %}
              {{ 8 if a < 1 else a | int }}
        - continue_on_error: true
          action: switch.turn_on
          target:
            entity_id: switch.x_charge
        - delay:
            seconds: 5

    - variables:
        charge_ok: >-
          {{ is_state('switch.x_charge', 'on')
             or states('sensor.x_charging') | lower in ['charging', 'starting'] }}
        still_complete: >-
          {{ is_state('sensor.x_charging', 'complete')
             and not is_state('switch.x_charge', 'on') }}

    - action: logbook.log
      data:
        name: Car charger (Tessie)
        message: >-
          Tessie start_charging — charge={{ states('sensor.x_charging') }},
          switch={{ states('switch.x_charge') }},
          amps={{ states('number.x_charge_current') }},
          limit={{ states('number.x_charge_limit') }}%,
          car SoC={{ states('sensor.x_battery_level') }}%,
          cell {{ states('sensor.battery_storage_tesla_pack_lowest_cell') }} V
        entity_id: switch.x_charge

    - if:
        - condition: template
          value_template: "{{ charge_ok | bool }}"
      then:
        - action: script.notify_iphone
          data:
            title: "Car charging started (Tessie)"
            message: >-
              charge={{ states('sensor.x_charging') }} ·
              amps={{ states('number.x_charge_current') }} ·
              limit={{ states('number.x_charge_limit') }}% ·
              car {{ states('sensor.x_battery_level') }}%.
      else:
        - action: script.notify_iphone
          data:
            title: "Car charging did not start"
            message: >-
              switch={{ states('switch.x_charge') }} ·
              charge={{ states('sensor.x_charging') }} ·
              limit={{ states('number.x_charge_limit') }}% ·
              car {{ states('sensor.x_battery_level') }}% ·
              cable={{ states('binary_sensor.x_charge_cable') }}.
              {% if still_complete | bool %}
              Still complete — limit may need to be above car SoC.
              {% endif %}
        - action: persistent_notification.create
          data:
            title: Car charging did not start
            message: >-
              switch={{ states('switch.x_charge') }},
              charge={{ states('sensor.x_charging') }},
              limit={{ states('number.x_charge_limit') }}%,
              car={{ states('sensor.x_battery_level') }}%.
            notification_id: car_charger_start_failed

notify_iphone:
  alias: Notify iPhone (OS top banner)
  icon: mdi:cellphone
  description: >
    OS top banner via Companion notify.mobile_app_plaid (time-sensitive).
  mode: queued
  fields:
    title:
      description: Notification title
      example: Battery alert
      required: true
      selector:
        text:
    message:
      description: Notification body
      example: Lowest cell is low
      required: true
      selector:
        text:
  sequence:
    - action: persistent_notification.create
      data:
        title: "{{ title }}"
        message: "{{ message }}"
        notification_id: pack_cell_low
    - action: notify.mobile_app_plaid
      data:
        title: "{{ title }}"
        message: "{{ message }}"
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
            interruption-level: time-sensitive
          ttl: 0
          priority: high
          channel: alarm
          importance: high
          url: /sunny-island/overview
          clickAction: /sunny-island/overview
          tag: pack_protection
          sticky: true
          presentation_options:
            - alert
            - sound
            - badge
