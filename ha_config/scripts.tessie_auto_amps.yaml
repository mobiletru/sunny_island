set_tessie_amps_from_bms:
  alias: Set Tessie amps from EVTV BMS
  icon: mdi:current-ac
  description: >
    Set number.x_charge_current to match EVTV TCCH charge-rate amps (floor),
    capped by input_number.tessie_amps_cap. When TCCH is 0, Tessie amps = 0.
    Optional light safety clamps (low cell / SoC / high cell).
  mode: queued
  max: 5
  max_exceeded: silent
  sequence:
    - variables:
        current_set: >-
          {% set s = states('number.x_charge_current') %}
          {{ s | float(-1) if s not in ['unavailable','unknown','none',''] else -1 }}
        target: >-
          {% set bad = ['unavailable','unknown','none',''] %}
          {% set tcch_s = states('sensor.battery_storage_tesla_pack_tcch_amps') %}
          {% set pack_a_s = states('sensor.battery_storage_tesla_pack_current') %}
          {% set soc_s = states('sensor.battery_storage_tesla_pack_state_of_charge') %}
          {% set cell_s = states('sensor.battery_storage_tesla_pack_lowest_cell') %}
          {% set hcell_s = states('sensor.battery_storage_tesla_pack_highest_cell') %}
          {% set cap_s = states('input_number.tessie_amps_cap') %}
          {% set tcch = tcch_s | float(0) if tcch_s not in bad else 0 %}
          {% set pack_a = pack_a_s | float(0) if pack_a_s not in bad else 0 %}
          {% set soc = soc_s | float(50) if soc_s not in bad else 50 %}
          {% set cell = cell_s | float(3.7) if cell_s not in bad else 3.7 %}
          {% set hcell = hcell_s | float(3.7) if hcell_s not in bad else 3.7 %}
          {% set cap = cap_s | float(32) if cap_s not in bad else 32 %}
          {# Match EVTV charge-rate (TCCH) only — never pack current (can be −discharge) #}
          {% set ns = namespace(a=[tcch | round(0, 'floor') | int, 0] | max) %}
          {# Pack discharging ≥ 10 A (−10 A or more) → do NOT match TCCH; force 0 A #}
          {% if pack_a <= -10 %}
            {% set ns.a = 0 %}
          {% elif cell <= 3.20 or soc <= 15 %}
            {% set ns.a = 0 %}
          {% elif cell <= 3.30 or soc <= 20 %}
            {% set ns.a = [ns.a, 8] | min %}
          {% elif hcell >= 4.08 %}
            {% set ns.a = [ns.a, 5] | min %}
          {% elif hcell >= 4.02 %}
            {% set ns.a = [ns.a, 12] | min %}
          {% endif %}
          {% set ns.a = [ns.a, cap | int, 48] | min %}
          {{ [ns.a, 0] | max }}
        detail: >-
          EVTV TCCH {{ states('sensor.battery_storage_tesla_pack_tcch_amps') }} A,
          pack {{ states('sensor.battery_storage_tesla_pack_current') }} A
          → Tessie {{ target | int }} A
          (no match when pack ≤ −10 A; cap {{ states('input_number.tessie_amps_cap') }} A)
    - if:
        - condition: template
          value_template: >-
            {{ states('number.x_charge_current') in
               ['unavailable','unknown','none',''] }}
      then:
        - stop: Tessie number.x_charge_current missing
    # Always write so 0 A is applied when EVTV rate is 0
    - continue_on_error: true
      action: number.set_value
      target:
        entity_id: number.x_charge_current
      data:
        value: "{{ target | int }}"
    - continue_on_error: true
      action: logbook.log
      data:
        name: EVTV → Tessie amps
        message: "{{ detail }} (was {{ current_set | int }} A)"
        entity_id: number.x_charge_current
    # TCCH 0 or pack discharging ≤ −10 A → Tessie 0 A and stop charge switch
    - if:
        - condition: template
          value_template: "{{ target | int == 0 and is_state('switch.x_charge', 'on') }}"
      then:
        - continue_on_error: true
          action: switch.turn_off
          target:
            entity_id: switch.x_charge
        - continue_on_error: true
          action: logbook.log
          data:
            name: EVTV → Tessie amps
            message: >-
              Tessie 0 A / charge off
              (TCCH {{ states('sensor.battery_storage_tesla_pack_tcch_amps') }} A,
              pack {{ states('sensor.battery_storage_tesla_pack_current') }} A;
              no match when pack ≤ −10 A)
            entity_id: switch.x_charge

# ---------------------------------------------------------------------------
# Match Tessie charge amps to Enphase solar production (kW coming in)
# amps = floor( production_kW * 1000 / EVSE_volts ), capped
# Optional surplus-only: max(0, production − house load)
# ---------------------------------------------------------------------------
set_tessie_amps_from_enphase:
  alias: Set Tessie amps from Enphase solar
  icon: mdi:solar-power
  description: >
    Set number.x_charge_current from Enphase current power production (kW).
    Converts kW → amps using input_number.tessie_evse_voltage (default 240 V).
    When production is 0, Tessie amps = 0.
  mode: queued
  max: 5
  max_exceeded: silent
  sequence:
    - if:
        - condition: template
          value_template: >-
            {{ states('number.x_charge_current') in
               ['unavailable','unknown','none',''] }}
      then:
        - stop: Tessie number.x_charge_current missing
    - variables:
        current_set: >-
          {{ states('number.x_charge_current') | float(0) | int }}
        target: >-
          {% set bad = ['unavailable','unknown','none',''] %}
          {% set prod_s = states('sensor.envoy_122039004946_current_power_production') %}
          {% set load_s = states('sensor.envoy_122039004946_current_power_consumption') %}
          {% set volt_s = states('input_number.tessie_evse_voltage') %}
          {% set cap_s = states('input_number.tessie_amps_cap') %}
          {% set prod = prod_s | float(0) if prod_s not in bad else 0 %}
          {% set load = load_s | float(0) if load_s not in bad else 0 %}
          {% set volt = volt_s | float(240) if volt_s not in bad else 240 %}
          {% set cap = cap_s | float(32) if cap_s not in bad else 32 %}
          {% set volt = [volt, 100] | max %}
          {# Enphase power is kW #}
          {% if is_state('input_boolean.enphase_surplus_only', 'on') %}
            {% set kw = [prod - load, 0] | max %}
          {% else %}
            {% set kw = [prod, 0] | max %}
          {% endif %}
          {% set amps = (kw * 1000 / volt) | round(0, 'floor') | int %}
          {% set amps = [amps, 0] | max %}
          {% set amps = [amps, cap | int] | min %}
          {{ [amps, 48] | min }}
        detail: >-
          Enphase prod {{ states('sensor.envoy_122039004946_current_power_production') }} kW,
          load {{ states('sensor.envoy_122039004946_current_power_consumption') }} kW,
          {{ 'surplus' if is_state('input_boolean.enphase_surplus_only', 'on') else 'full production' }}
          @ {{ states('input_number.tessie_evse_voltage') }} V
          → Tessie {{ target | int }} A
    - continue_on_error: true
      action: number.set_value
      target:
        entity_id: number.x_charge_current
      data:
        value: "{{ target | int }}"
    - continue_on_error: true
      action: logbook.log
      data:
        name: Enphase → Tessie amps
        message: "{{ detail }} (was {{ current_set | int }} A)"
        entity_id: number.x_charge_current
    - if:
        - condition: template
          value_template: "{{ target | int == 0 and is_state('switch.x_charge', 'on') }}"
      then:
        - continue_on_error: true
          action: switch.turn_off
          target:
            entity_id: switch.x_charge
        - continue_on_error: true
          action: logbook.log
          data:
            name: Enphase → Tessie amps
            message: Solar production ~0 kW — Tessie 0 A / charge off
            entity_id: switch.x_charge

# One-shot: enable Enphase match and start charge if solar > 0
start_enphase_matched_charge:
  alias: Start charge matching Enphase solar
  icon: mdi:solar-power
  description: >
    Enable match_enphase_solar, set Tessie amps from Enphase production,
    start charging if computed amps ≥ 1.
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.match_enphase_solar
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.hold_evtv_current
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.match_evtv_charge_amps
    - action: script.set_tessie_amps_from_enphase
      continue_on_error: true
    - variables:
        amps: "{{ states('number.x_charge_current') | float(0) }}"
    - if:
        - condition: template
          value_template: "{{ amps | float(0) >= 1 }}"
      then:
        - action: script.start_car_charger
          continue_on_error: true
        - action: script.notify_iphone
          data:
            title: "Enphase match charge"
            message: >-
              Solar {{ states('sensor.envoy_122039004946_current_power_production') }} kW
              → Tessie {{ states('number.x_charge_current') }} A
      else:
        - action: script.notify_iphone
          data:
            title: "Enphase match charge"
            message: Solar too low for charge — Tessie 0 A

# ---------------------------------------------------------------------------
# Hold EVTV pack current at a setpoint (default −10 A) by trimming Tessie amps.
# Sign: − discharge · + charge. More Tessie A → more pack discharge (more negative).
# ---------------------------------------------------------------------------
trim_tessie_for_pack_current:
  alias: Trim Tessie amps for EVTV pack current target
  icon: mdi:gauge
  description: >
    Adjust number.x_charge_current so pack current approaches
    input_number.evtv_pack_current_target (default −10 A). Deadband ±1.5 A.
  mode: single
  sequence:
    - if:
        - condition: template
          value_template: >-
            {{ states('number.x_charge_current') in
               ['unavailable','unknown','none','']
               or states('sensor.battery_storage_tesla_pack_current') in
               ['unavailable','unknown','none',''] }}
      then:
        - stop: Missing Tessie or pack current entity
    - variables:
        pack_a: >-
          {{ states('sensor.battery_storage_tesla_pack_current') | float(0) }}
        target: >-
          {{ states('input_number.evtv_pack_current_target') | float(-10) }}
        cur: >-
          {{ states('number.x_charge_current') | float(0) | int }}
        cap: >-
          {{ states('input_number.tessie_amps_cap') | float(32) | int }}
        # error > 0: pack higher than target (not discharging enough) → raise Tessie
        # error < 0: pack lower than target (discharging too hard) → lower Tessie
        error: "{{ pack_a | float - target | float }}"
        step: >-
          {% set e = error | float %}
          {% if e > 6 %} 3
          {% elif e > 3 %} 2
          {% elif e > 1.5 %} 1
          {% elif e < -6 %} -3
          {% elif e < -3 %} -2
          {% elif e < -1.5 %} -1
          {% else %} 0
          {% endif %}
        new_amps: >-
          {% set n = cur | int + step | int %}
          {% set n = [n, 0] | max %}
          {% set n = [n, cap | int] | min %}
          {{ [n, 48] | min }}
    - if:
        - condition: template
          value_template: "{{ step | int != 0 and new_amps | int != cur | int }}"
      then:
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: "{{ new_amps | int }}"
        - continue_on_error: true
          action: logbook.log
          data:
            name: Hold EVTV current
            message: >-
              Pack {{ pack_a }} A (target {{ target }} A, err {{ error }}) →
              Tessie {{ cur }} A → {{ new_amps }} A
            entity_id: number.x_charge_current

# One-shot: enable hold-at-target mode and start charge
start_hold_evtv_current:
  alias: Hold EVTV pack at target (Tessie trim)
  icon: mdi:gauge
  description: >
    Enable hold_evtv_current, start car charge, then keep trimming Tessie amps
    so pack current stays near input_number.evtv_pack_current_target (−10 A).
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.hold_evtv_current
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.match_evtv_charge_amps
    - action: script.start_car_charger
      continue_on_error: true
    - delay:
        seconds: 8
    - action: script.trim_tessie_for_pack_current
      continue_on_error: true
    - action: script.notify_iphone
      data:
        title: "Hold EVTV current"
        message: >-
          Target {{ states('input_number.evtv_pack_current_target') }} A ·
          pack now {{ states('sensor.battery_storage_tesla_pack_current') }} A ·
          Tessie {{ states('number.x_charge_current') }} A.

# One-shot button: enable match mode, sync amps, start charge if EVTV > 0
start_evtv_matched_charge:
  alias: Start charge matching EVTV amps
  icon: mdi:current-ac
  description: >
    Turn on Match EVTV→Tessie amps, set Tessie current to EVTV TCCH (0 stays 0),
    and start charging if EVTV rate > 0.
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.match_evtv_charge_amps
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.auto_tessie_amps
    - action: script.set_tessie_amps_from_bms
      continue_on_error: true
    - variables:
        rate: >-
          {% set s = states('sensor.battery_storage_tesla_pack_tcch_amps') %}
          {{ s | float(0) if s not in ['unavailable','unknown','none',''] else 0 }}
    - if:
        - condition: template
          value_template: "{{ rate | float(0) >= 1 }}"
      then:
        - action: script.start_car_charger
          continue_on_error: true
        - action: script.notify_iphone
          data:
            title: "EVTV match charge"
            message: >-
              Matching Tessie to EVTV {{ rate }} A
              (Tessie now {{ states('number.x_charge_current') }} A).
      else:
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: 0
        - continue_on_error: true
          action: switch.turn_off
          target:
            entity_id: switch.x_charge
        - action: script.notify_iphone
          data:
            title: "EVTV match charge"
            message: EVTV charge rate is 0 A — Tessie set to 0 A / charge off.
