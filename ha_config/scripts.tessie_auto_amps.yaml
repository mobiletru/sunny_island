set_tessie_amps_from_bms:
  alias: Set Tessie amps from EVTV BMS
  icon: mdi:current-ac
  description: >
    Compute target charge amps from EVTV BMS TCCH + safety clamps and apply to
    number.x_charge_current. Uses namespace() so Jinja if-scopes do not drop clamps.
    Cap: input_number.tessie_amps_cap (default 32 A).
  mode: queued
  max: 3
  max_exceeded: silent
  sequence:
    - variables:
        current_set: >-
          {% set s = states('number.x_charge_current') %}
          {{ s | float(-1) if s not in ['unavailable','unknown','none',''] else -1 }}
        target: >-
          {% set bad = ['unavailable','unknown','none',''] %}
          {% set tcch_s = states('sensor.battery_storage_tesla_pack_tcch_amps') %}
          {% set soc_s = states('sensor.battery_storage_tesla_pack_state_of_charge') %}
          {% set cell_s = states('sensor.battery_storage_tesla_pack_lowest_cell') %}
          {% set hcell_s = states('sensor.battery_storage_tesla_pack_highest_cell') %}
          {% set pack_a_s = states('sensor.battery_storage_tesla_pack_current') %}
          {% set cap_s = states('input_number.tessie_amps_cap') %}
          {% set tcch = tcch_s | float(0) if tcch_s not in bad else 0 %}
          {% set soc = soc_s | float(50) if soc_s not in bad else 50 %}
          {% set cell = cell_s | float(3.7) if cell_s not in bad else 3.7 %}
          {% set hcell = hcell_s | float(3.7) if hcell_s not in bad else 3.7 %}
          {% set pack_a = pack_a_s | float(0) if pack_a_s not in bad else 0 %}
          {% set cap = cap_s | float(32) if cap_s not in bad else 32 %}
          {# namespace so if/elif clamps actually stick (Jinja block scope) #}
          {% set ns = namespace(a=[tcch | round(0, 'floor') | int, 0] | max) %}
          {% if cell <= 3.25 or soc <= 18 %}
            {% set ns.a = 0 %}
          {% elif cell <= 3.35 or soc <= 25 %}
            {% set ns.a = [ns.a, 8] | min %}
          {% elif hcell >= 4.05 %}
            {% set ns.a = [ns.a, 5] | min %}
          {% elif hcell >= 4.00 %}
            {% set ns.a = [ns.a, 12] | min %}
          {% endif %}
          {# House pack discharging hard while car charges — soft limit #}
          {% if pack_a < -80 %}
            {% set ns.a = [ns.a, 8] | min %}
          {% elif pack_a < -40 %}
            {% set ns.a = [ns.a, 16] | min %}
          {% endif %}
          {% set ns.a = [ns.a, cap | int] | min %}
          {% set ns.a = [ns.a, 48] | min %}
          {{ [ns.a, 0] | max }}
        detail: >-
          {% set bad = ['unavailable','unknown','none',''] %}
          TCCH {{ states('sensor.battery_storage_tesla_pack_tcch_amps') }},
          cell {{ states('sensor.battery_storage_tesla_pack_lowest_cell') }} V,
          high {{ states('sensor.battery_storage_tesla_pack_highest_cell') }} V,
          SoC {{ states('sensor.battery_storage_tesla_pack_state_of_charge') }}%,
          pack {{ states('sensor.battery_storage_tesla_pack_current') }} A,
          cap {{ states('input_number.tessie_amps_cap') }} A
    # Wake if car might be asleep (ignore errors when already awake / not home)
    - if:
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.x_charge
              state: "on"
            - condition: template
              value_template: >-
                {{ states('sensor.x_charging') | lower in
                   ['charging', 'starting', 'stopped', 'complete', 'nopower'] }}
      then:
        - continue_on_error: true
          action: button.press
          target:
            entity_id: button.x_wake
        - delay:
            milliseconds: 800
    # Always write (Tessie sometimes ignores no-op / drifts back)
    - continue_on_error: true
      action: number.set_value
      target:
        entity_id: number.x_charge_current
      data:
        value: "{{ target | int }}"
    - continue_on_error: true
      action: logbook.log
      data:
        name: Tessie auto amps
        message: >-
          Charge current {{ current_set | int }} A → {{ target | int }} A
          ({{ detail }})
        entity_id: number.x_charge_current
    # Second write after short settle (Tessie lag)
    - delay:
        milliseconds: 1500
    - if:
        - condition: template
          value_template: >-
            {{ states('number.x_charge_current') | float(-1) | int != target | int }}
      then:
        - continue_on_error: true
          action: number.set_value
          target:
            entity_id: number.x_charge_current
          data:
            value: "{{ target | int }}"
