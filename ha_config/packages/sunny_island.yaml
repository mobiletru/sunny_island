# Sunny Island plant package — helpers for charge control + voltage stop.
# Loaded via: homeassistant.packages: !include_dir_named packages

input_boolean:
  car_charger:
    name: Car charger flag
    icon: mdi:ev-station
  auto_tessie_amps:
    name: Auto Tessie amps (from BMS)
    icon: mdi:current-ac
    initial: true
  # When on: Tessie charge amps always track EVTV TCCH (including 0 A)
  match_evtv_charge_amps:
    name: Match EVTV charge amps → Tessie
    icon: mdi:sync
    initial: false
  # When on: trim Tessie amps so pack current stays near target (default −10 A)
  hold_evtv_current:
    name: Hold EVTV pack current (via Tessie amps)
    icon: mdi:gauge
    initial: false
  # When on: Tessie amps track Enphase solar production (kW → A)
  match_enphase_solar:
    name: Match Enphase solar → Tessie amps
    icon: mdi:solar-power
    initial: true
  # If on: only use surplus (production − house load), not full production
  enphase_surplus_only:
    name: Enphase surplus only (not full production)
    icon: mdi:home-export-outline
    initial: false
  tessie_stop_on_pack_volts:
    name: Stop Tessie on low pack V
    icon: mdi:battery-alert
    initial: true
  tessie_stop_on_cell_volts:
    name: Stop Tessie on low cell V
    icon: mdi:battery-low
    initial: true

input_number:
  tessie_amps_cap:
    name: Tessie charge amps cap
    min: 0
    max: 48
    step: 1
    unit_of_measurement: A
    initial: 32
    mode: box
    icon: mdi:speedometer

  # Target pack current (− discharge · + charge). Default −10 A = 10 A discharge.
  evtv_pack_current_target:
    name: EVTV pack current target
    min: -48
    max: 48
    step: 1
    unit_of_measurement: A
    initial: -10
    mode: box
    icon: mdi:current-dc

  # EVSE AC volts for solar→amps (US wall connector typically 240 V)
  tessie_evse_voltage:
    name: Tessie EVSE voltage
    min: 100
    max: 250
    step: 1
    unit_of_measurement: V
    initial: 240
    mode: box
    icon: mdi:sine-wave

  # Pack bus voltage (12S ≈ 36–50 V). Default 38.4 V ≈ 3.2 V/cell × 12.
  tessie_stop_pack_volts:
    name: Stop Tessie below pack V
    min: 30
    max: 50
    step: 0.1
    unit_of_measurement: V
    initial: 38.4
    mode: box
    icon: mdi:sine-wave

  # Lowest / trigger cell voltage hard stop
  tessie_stop_cell_volts:
    name: Stop Tessie below cell V
    min: 2.8
    max: 3.6
    step: 0.01
    unit_of_measurement: V
    initial: 3.2
    mode: box
    icon: mdi:battery-outline

  tessie_stop_soc:
    name: Stop Tessie below pack SoC
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "%"
    initial: 15
    mode: box
    icon: mdi:battery-30
