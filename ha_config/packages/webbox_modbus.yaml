# SMA Sunny WebBox — Modbus TCP sensors & parameters
# Host: secrets.webbox_host (e.g. 192.168.x.x) — set in /config/secrets.yaml
# Optional: secrets.webbox_password for BMS RPC (integration option webbox_password)
# Unit IDs: 1=gateway · 2=plant · 3=first device (SI / inverter)
# Enable Modbus on WebBox: Settings → Interfaces → Modbus

modbus:
  - name: webbox
    type: tcp
    host: !secret webbox_host
    port: 502
    delay: 1
    timeout: 5
    retries: 2
    sensors:
      # ── Gateway (Unit ID 1) ───────────────────────────────────────────
      - name: WebBox Modbus Profile
        unique_id: webbox_modbus_profile
        slave: 1
        address: 30001
        data_type: uint32
        scan_interval: 300

      - name: WebBox Serial Number
        unique_id: webbox_serial_number
        slave: 1
        address: 30057
        data_type: uint32
        scan_interval: 300

      # ── Plant (Unit ID 2) ─────────────────────────────────────────────
      - name: WebBox Plant Power
        unique_id: webbox_plant_power
        slave: 2
        address: 30775
        data_type: int32
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 15

      - name: WebBox Plant Daily Yield
        unique_id: webbox_plant_daily_yield
        slave: 2
        address: 30517
        data_type: int64
        scale: 0.001
        precision: 3
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      - name: WebBox Plant Total Yield
        unique_id: webbox_plant_total_yield
        slave: 2
        address: 30513
        data_type: int64
        scale: 0.001
        precision: 3
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: 300

      # ── Device / SI (Unit ID 3) ────────────────────────────────────────
      - name: WebBox Device Power AC
        unique_id: webbox_device_power_ac
        slave: 3
        address: 30775
        data_type: int32
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 15

      - name: WebBox Grid Voltage
        unique_id: webbox_grid_voltage
        slave: 3
        address: 30783
        data_type: int32
        scale: 0.01
        precision: 2
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 30

      - name: WebBox Grid Frequency
        unique_id: webbox_grid_frequency
        slave: 3
        address: 30803
        data_type: uint32
        scale: 0.01
        precision: 2
        unit_of_measurement: Hz
        device_class: frequency
        state_class: measurement
        scan_interval: 30

      - name: WebBox Reactive Power
        unique_id: webbox_reactive_power
        slave: 3
        address: 30805
        data_type: int32
        unit_of_measurement: var
        device_class: reactive_power
        state_class: measurement
        scan_interval: 30

      - name: WebBox Apparent Power
        unique_id: webbox_apparent_power
        slave: 3
        address: 30813
        data_type: int32
        unit_of_measurement: VA
        device_class: apparent_power
        state_class: measurement
        scan_interval: 30

      - name: WebBox Device Status Code
        unique_id: webbox_device_status_code
        slave: 3
        address: 30201
        data_type: int32
        scan_interval: 30

      - name: WebBox Grid Relay Code
        unique_id: webbox_grid_relay_code
        slave: 3
        address: 30217
        data_type: uint32
        scan_interval: 60

      - name: WebBox Operating Time
        unique_id: webbox_operating_time
        slave: 3
        address: 30541
        data_type: uint32
        unit_of_measurement: s
        device_class: duration
        state_class: total_increasing
        scan_interval: 300

      - name: WebBox Battery Voltage
        unique_id: webbox_battery_voltage
        slave: 3
        address: 30845
        data_type: int32
        # FIX0 on this WebBox profile (raw ~47 ≈ SI DC bus volts)
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 30

      - name: WebBox Battery SoC
        unique_id: webbox_battery_soc
        slave: 3
        address: 30865
        data_type: uint32
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        scan_interval: 30

      - name: WebBox Battery Temp
        unique_id: webbox_battery_temp
        slave: 3
        address: 30849
        data_type: int32
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 60

      - name: WebBox Device Serial
        unique_id: webbox_device_serial
        slave: 3
        address: 30057
        data_type: uint32
        scan_interval: 300

      - name: WebBox Device SuSy ID
        unique_id: webbox_device_susy_id
        slave: 3
        address: 30053
        data_type: uint32
        scan_interval: 300

template:
  - sensor:
      - name: WebBox Device Status
        unique_id: webbox_device_status
        state: >-
          {% set c = states('sensor.webbox_device_status_code') %}
          {% if c in ['unavailable','unknown','none',''] %}
            unknown
          {% elif c | int == 307 %}
            OK
          {% elif c | int == 303 %}
            Off
          {% elif c | int == 455 %}
            Warning
          {% elif c | int == 35 %}
            Fault
          {% else %}
            code {{ c }}
          {% endif %}
        icon: mdi:information-outline

      - name: WebBox Grid Relay
        unique_id: webbox_grid_relay
        state: >-
          {% set c = states('sensor.webbox_grid_relay_code') %}
          {% if c in ['unavailable','unknown','none',''] %}
            unknown
          {% elif c | int == 51 %}
            Closed
          {% else %}
            Open
          {% endif %}
        icon: mdi:electric-switch

      - name: WebBox Plant Power kW
        unique_id: webbox_plant_power_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >-
          {% set p = states('sensor.webbox_plant_power') %}
          {% if p in ['unavailable','unknown','none',''] %}
            unavailable
          {% else %}
            {{ (p | float(0) / 1000) | round(3) }}
          {% endif %}
