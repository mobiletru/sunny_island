# ---------------------------------------------------------------------------
# Match Tessie charge amps to EVTV BMS charge-rate (TCCH), including 0 A
# Toggle: input_boolean.match_evtv_charge_amps (and/or auto_tessie_amps)
# Cap:    input_number.tessie_amps_cap
# ---------------------------------------------------------------------------
- id: tessie_match_evtv_charge_amps
  alias: Tessie match EVTV charge amps
  description: >
    When Match EVTV charge amps is on, set number.x_charge_current to floor(TCCH)
    every TCCH change and every minute. EVTV 0 A → Tessie 0 A (and stops charge).
  mode: queued
  max: 5
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - sensor.battery_storage_tesla_pack_tcch_amps
        - input_boolean.match_evtv_charge_amps
        - input_boolean.auto_tessie_amps
        - input_number.tessie_amps_cap
        - switch.x_charge
        - sensor.x_charging
    - trigger: time_pattern
      seconds: "/30"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.match_evtv_charge_amps
          state: "on"
        - condition: state
          entity_id: input_boolean.auto_tessie_amps
          state: "on"
  actions:
    - action: script.set_tessie_amps_from_bms
      continue_on_error: true

# When match mode is on and EVTV rate rises above 0 while car is plugged, keep amps in sync
# (start is left to the Start match-charge button / start_car_charger)
- id: tessie_auto_amps_from_bms
  alias: Tessie auto amps from EVTV BMS
  description: >
    Legacy alias — same as match automation while charging (safety net).
  mode: queued
  max: 3
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - sensor.battery_storage_tesla_pack_tcch_amps
        - switch.x_charge
        - sensor.x_charging
        - input_boolean.auto_tessie_amps
        - input_number.tessie_amps_cap
    - trigger: time_pattern
      minutes: "/1"
  conditions:
    - condition: state
      entity_id: input_boolean.auto_tessie_amps
      state: "on"
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.x_charge
          state: "on"
        - condition: state
          entity_id: input_boolean.car_charger
          state: "on"
        - condition: template
          value_template: >-
            {{ states('sensor.x_charging') | lower in ['charging', 'starting'] }}
  actions:
    - action: script.set_tessie_amps_from_bms
      continue_on_error: true
